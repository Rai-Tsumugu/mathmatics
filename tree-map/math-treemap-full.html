<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大学数学 統合学習ツリーマップ</title>
<style>
:root{
 --bg:#0c0e14;--panel:#151924;--panel2:#1c2230;--line:#262c3c;
 --txt:#e9ecf3;--dim:#8790a6;--faint:#59617a;
 --calc:#4f9cf9;--lin:#f5a524;--disc:#2dd4bf;--prob:#f472b6;--bridge:#a78bfa;--ml:#22c55e;--done:#2a7a52;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);
 font-family:-apple-system,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif;-webkit-font-smoothing:antialiased}
.top{padding:20px 24px 0;max-width:1600px;margin:0 auto}
h1{font-size:22px;margin:0 0 5px}
.lead{color:var(--dim);font-size:12.5px;margin:0;line-height:1.7}
.lead b{color:var(--txt);font-weight:600}

.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:14px 0 8px;font-size:11.5px;color:var(--dim)}
.pbar{flex:0 1 200px;height:7px;background:var(--panel2);border-radius:6px;overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--calc),var(--lin),var(--prob));transition:width .3s}
.bar button{background:var(--panel2);border:1px solid var(--line);color:var(--dim);
 padding:4px 10px;border-radius:6px;font-size:11px;cursor:pointer;font-family:inherit}
.bar button:hover{color:var(--txt);border-color:var(--dim)}
.bar .sep{width:1px;height:16px;background:var(--line)}
.lg{display:flex;align-items:center;gap:5px;cursor:pointer;user-select:none;padding:2px 6px;border-radius:5px}
.lg:hover{background:var(--panel2)}
.lg.off{opacity:.35}
.dot{width:9px;height:9px;border-radius:3px;flex:none}

.scroll{overflow-x:auto;padding:0 24px 26px;max-width:1600px;margin:0 auto}
.canvas{position:relative;width:1444px;height:1330px;transform-origin:top left}
svg.edges{position:absolute;inset:0;width:1444px;height:1330px;pointer-events:none;overflow:visible}
.edge{fill:none;stroke:#2b3244;stroke-width:1.5}
.edge.cross{stroke:#3b3358;stroke-dasharray:5 4;stroke-width:1.3}
.edge.hi{stroke:#7dd3fc;stroke-width:2.4;stroke-dasharray:none;filter:drop-shadow(0 0 4px rgba(125,211,252,.5))}
.edge.dim{opacity:.12}

.band{position:absolute;border-radius:14px;pointer-events:none}
.band span{position:absolute;top:7px;left:13px;font-size:10.5px;letter-spacing:.16em;font-weight:700;opacity:.62}

.n{position:absolute;background:var(--panel);border:1px solid var(--line);
 border-top:2.5px solid var(--c);border-radius:9px;padding:8px 10px;cursor:pointer;
 transition:transform .12s,background .12s,box-shadow .12s,opacity .15s;overflow:hidden}
.n:hover{background:var(--panel2);transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.5)}
.n.sel{background:var(--panel2);box-shadow:0 0 0 1.5px var(--c),0 8px 24px rgba(0,0,0,.55)}
.n.dim{opacity:.16}
.n.hidden{display:none}
.n.done{border-top-color:var(--done)}
.n.done .ttl{color:var(--faint);text-decoration:line-through}
.n.core{border-width:1px 1px 1px 1px;border-top-width:3.5px}
.ttl{font-size:12.5px;font-weight:600;line-height:1.35;padding-right:14px}
.sb{font-size:10px;color:var(--faint);margin-top:3px;line-height:1.4;
 display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mlb{position:absolute;top:6px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--ml)}
.n.done .mlb{background:var(--done)}
.ck{position:absolute;bottom:4px;right:5px;width:15px;height:15px;border:1.4px solid var(--line);
 border-radius:4px;font-size:9px;color:transparent;display:flex;align-items:center;justify-content:center;background:var(--bg)}
.ck:hover{border-color:var(--dim)}
.n.done .ck{background:var(--done);border-color:var(--done);color:#fff}

.dr{position:fixed;top:0;right:0;width:440px;max-width:93vw;height:100%;background:var(--panel);
 border-left:1px solid var(--line);transform:translateX(100%);transition:transform .25s;
 z-index:100;overflow-y:auto;padding:24px 26px 70px;box-shadow:-20px 0 50px rgba(0,0,0,.55)}
.dr.on{transform:none}
.dr .x{position:absolute;top:13px;right:16px;background:none;border:none;color:var(--dim);font-size:22px;cursor:pointer}
.dr h2{font-size:18.5px;margin:0 0 5px;padding-right:30px;line-height:1.4}
.meta{font-size:11.5px;color:var(--faint);margin-bottom:14px}
.chip{display:inline-block;padding:2px 9px;border-radius:20px;font-size:10.5px;font-weight:600;
 border:1px solid;margin-right:6px}
.dr h4{font-size:10.5px;letter-spacing:.1em;color:var(--dim);margin:18px 0 6px;font-weight:700}
.dr p{margin:0;font-size:13.5px;line-height:1.8}
.dr ul{margin:0;padding-left:18px;font-size:12.8px;line-height:1.85}
.mlbox{background:#0d2b1c;border:1px solid #1c5c38;border-radius:8px;padding:10px 13px;
 font-size:12.5px;color:#9ae6b8;line-height:1.7}
.tipbox{background:var(--panel2);border-radius:8px;padding:10px 13px;font-size:12.5px;color:var(--dim);line-height:1.7;margin-top:14px}
.rel{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.rel b{font-size:11.5px;background:var(--panel2);border:1px solid var(--line);border-radius:20px;
 padding:3px 10px;cursor:pointer;font-weight:500}
.rel b:hover{border-color:var(--dim);color:#fff}
.route{counter-reset:s;margin:6px 0 0;padding:0;list-style:none;font-size:12.5px}
.route li{counter-increment:s;padding:4px 0 4px 26px;position:relative;line-height:1.6;
 border-left:1px solid var(--line);margin-left:7px}
.route li::before{content:counter(s);position:absolute;left:-9px;top:6px;width:17px;height:17px;
 background:var(--panel2);border:1px solid var(--line);border-radius:50%;font-size:9.5px;
 display:flex;align-items:center;justify-content:center;color:var(--dim)}
.route li.ok::before{background:var(--done);border-color:var(--done);color:#fff;content:"✓"}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:99;display:none}
.mask.on{display:block}
.foot{max-width:1600px;margin:0 auto;padding:0 24px 50px;color:var(--faint);font-size:11.5px;line-height:1.8}
</style>
</head>
<body>

<div class="top">
  <h1>大学数学 統合学習ツリーマップ</h1>
  <p class="lead"><b>微分積分</b>と<b>線形代数</b>を幹に、そこから伸びる周辺分野（解析の応用・離散数学・確率統計・応用数学）を1枚に統合。<br>
  実線＝同分野内の前提関係、点線＝分野をまたぐ依存。ノードをクリックすると<b>その単元までの学習経路</b>が表示されます。</p>
  <div class="bar">
    <b id="pct" style="color:var(--txt);font-size:13.5px">0%</b>
    <div class="pbar"><i id="fill"></i></div>
    <span id="cnt"></span>
    <span class="sep"></span>
    <button onclick="zoom(-1)">−</button><button onclick="zoom(0)">全体</button><button onclick="zoom(1)">＋</button>
    <button onclick="toggleML()" id="mlbtn">ML必須のみ</button>
    <button onclick="resetAll()">リセット</button>
    <span class="sep"></span>
    <span class="lg" data-f="calc"><i class="dot" style="background:var(--calc)"></i>微分積分系</span>
    <span class="lg" data-f="lin"><i class="dot" style="background:var(--lin)"></i>線形代数系</span>
    <span class="lg" data-f="disc"><i class="dot" style="background:var(--disc)"></i>離散・基礎</span>
    <span class="lg" data-f="prob"><i class="dot" style="background:var(--prob)"></i>確率・統計</span>
    <span class="lg" data-f="bridge"><i class="dot" style="background:var(--bridge)"></i>応用・合流</span>
    <span class="lg" style="cursor:default"><i class="dot" style="background:var(--ml);border-radius:50%"></i>ML必須</span>
  </div>
</div>

<div class="scroll"><div class="canvas" id="cv"><svg class="edges" id="sv"></svg></div></div>

<div class="foot">
  横スクロール／ズームで全体表示。進捗はブラウザに保存されます。<br>
  <b style="color:var(--dim)">主軸（太枠）</b>＝理系学部で必修の微分積分・線形代数。それ以外は学科・進路に応じて取捨選択してください。
</div>

<div class="mask" id="mask" onclick="closeDr()"></div>
<div class="dr" id="dr"><button class="x" onclick="closeDr()">×</button><div id="drc"></div></div>

};

/* ================= 依存関係 ================= */
/* [前提, 次, 1=分野横断（点線）] */
const E=[

 ["lim","dif"],["dif","tay"],["dif","int"],["dif","pd"],["dif","ode"],

/* ================= 描画 ================= */
const cv=document.getElementById("cv"),sv=document.getElementById("sv");
let store={};try{store=JSON.parse(localStorage.getItem("mathfull")||"{}")}catch(e){store={}}
const save=()=>{try{localStorage.setItem("mathfull",JSON.stringify(store))}catch(e){}};
const CC={calc:"var(--calc)",lin:"var(--lin)",disc:"var(--disc)",prob:"var(--prob)",bridge:"var(--bridge)"};
const CH={calc:"#4f9cf9",lin:"#f5a524",disc:"#2dd4bf",prob:"#f472b6",bridge:"#a78bfa"};
const CN={calc:"微分積分系",lin:"線形代数系",disc:"離散・基礎",prob:"確率・統計",bridge:"応用・合流"};
/* 分野をまたぐエッジは自動判定（根と合流帯は中立） */
const ROOTS=new Set(["root_hs","root_log"]);
const isCross=(a,b)=>!ROOTS.has(a)&&N[a].c!=="bridge"&&N[b].c!=="bridge"&&N[a].c!==N[b].c;
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");

/* 帯 */
[["解析 — 微分積分を主軸に",10,1,8,594,"79,156,249"],
 ["代数 — 線形代数を主軸に",616,1,8,400,"245,165,36"],
 ["離散数学・数学の基礎",1028,1,4,404,"45,212,191"],
 ["確率・統計",1028,5,8,404,"244,114,182"]].forEach(([lb,x,r1,r2,w,rgb])=>{
  const d=document.createElement("div");d.className="band";
  d.style.cssText=`left:${x}px;top:${ROW(r1)-26}px;width:${w}px;height:${ROW(r2)+H+16-(ROW(r1)-26)}px;
   background:rgba(${rgb},.035);border:1px solid rgba(${rgb},.14)`;
  d.innerHTML=`<span style="color:rgb(${rgb});top:-19px">${lb}</span>`;cv.appendChild(d);
});
const bb=document.createElement("div");bb.className="band";
bb.style.cssText=`left:10px;top:${ROW(9)-26}px;width:1422px;height:${ROW(10)+H+16-(ROW(9)-26)}px;
 background:rgba(167,139,250,.05);border:1px solid rgba(167,139,250,.17)`;
bb.innerHTML='<span style="color:#a78bfa;top:-19px">合流点 — 応用数学 / 機械学習の数学</span>';cv.appendChild(bb);

const pos={},els={};
Object.entries(N).forEach(([k,n])=>{
 const x=n.x!==undefined?n.x:COL[n.col],w=n.w||W,y=ROW(n.r);
 pos[k]={x,y,w,h:H};
 const d=document.createElement("div");
 d.className="n"+(store[k]?" done":"")+(n.core?" core":"");d.dataset.k=k;d.dataset.c=n.c;
 d.style.cssText=`left:${x}px;top:${y}px;width:${w}px;height:${H}px;--c:${CC[n.c]}`;
 d.innerHTML=`${n.ml?'<i class="mlb"></i>':''}<div class="ttl">${esc(n.t)}</div>
  <div class="sb">${esc(n.s)}</div><div class="ck">✓</div>`;
 d.querySelector(".ck").addEventListener("click",e=>{e.stopPropagation();
  store[k]?delete store[k]:store[k]=1;d.classList.toggle("done");save();upd()});
 d.addEventListener("click",()=>openDr(k));
 d.addEventListener("mouseenter",()=>{if(!dr.classList.contains("on"))hi(k)});
 d.addEventListener("mouseleave",()=>{if(!dr.classList.contains("on"))hi(null)});
 cv.appendChild(d);els[k]=d;
});

const NS="http://www.w3.org/2000/svg";
E.forEach(([a,b])=>{
 const cross=isCross(a,b);
 const p=pos[a],q=pos[b];
 const x1=p.x+p.w/2,y1=p.y+p.h,x2=q.x+q.w/2,y2=q.y,dy=Math.max(26,(y2-y1)*.45);
 const path=document.createElementNS(NS,"path");
 path.setAttribute("d",`M${x1},${y1} C${x1},${y1+dy} ${x2},${y2-dy} ${x2},${y2}`);
 path.setAttribute("class","edge"+(cross?" cross":""));
 path.dataset.a=a;path.dataset.b=b;sv.appendChild(path);
 const m=document.createElementNS(NS,"circle");
 m.setAttribute("cx",x2);m.setAttribute("cy",y2-1);m.setAttribute("r",2.5);
 m.setAttribute("fill",cross?"#463a6b":"#39415a");sv.appendChild(m);
});

/* 祖先・子孫 */
const par={},chi={};
E.forEach(([a,b])=>{(chi[a]=chi[a]||[]).push(b);(par[b]=par[b]||[]).push(a)});
function walk(k,g){const s=new Set(),st=[k];
 while(st.length){const c=st.pop();(g[c]||[]).forEach(n=>{if(!s.has(n)){s.add(n);st.push(n)}})}return s}

function hi(k){
 const eds=sv.querySelectorAll(".edge");
 if(!k){eds.forEach(e=>e.classList.remove("hi","dim"));
  Object.values(els).forEach(e=>e.classList.remove("dim"));return}
 const anc=walk(k,par),des=walk(k,chi),rel=new Set([...anc,...des,k]);
 eds.forEach(e=>{const on=rel.has(e.dataset.a)&&rel.has(e.dataset.b);
  e.classList.toggle("hi",on);e.classList.toggle("dim",!on)});
 Object.entries(els).forEach(([kk,e])=>e.classList.toggle("dim",!rel.has(kk)));
}

/* ドロワー */
const dr=document.getElementById("dr"),drc=document.getElementById("drc"),mask=document.getElementById("mask");
function openDr(k){
 const n=N[k],pre=par[k]||[],nx=chi[k]||[];
 const anc=[...walk(k,par)].sort((a,b)=>N[a].r-N[b].r||a.localeCompare(b));
 Object.values(els).forEach(e=>e.classList.remove("sel"));els[k].classList.add("sel");
 const col=CH[n.c];
 drc.innerHTML=`
  <h2>${esc(n.t)}</h2>
  <div class="meta">
    <span class="chip" style="color:${col};border-color:${col}44;background:${col}18">${CN[n.c]}</span>
    ${esc(n.term)}${n.ml?' ・ <span style="color:var(--ml)">ML必須度 高</span>':''}${n.core?' ・ <span style="color:var(--txt)">主軸</span>':''}
  </div>
  <h4>なぜ学ぶか</h4><p>${esc(n.why)}</p>
  <h4>主な内容</h4><ul>${n.topics.map(t=>`<li>${esc(t)}</li>`).join("")}</ul>
  ${n.mlUse?`<h4>ML・データ科学での使われ方</h4><div class="mlbox">${esc(n.mlUse)}</div>`:""}
  ${n.tip?`<div class="tipbox">💡 ${esc(n.tip)}</div>`:""}
  ${pre.length?`<h4>直前の前提</h4><div class="rel">${pre.map(p=>`<b onclick="openDr('${p}')">${esc(N[p].t)}</b>`).join("")}</div>`:""}
  ${nx.length?`<h4>この先に進める単元</h4><div class="rel">${nx.map(p=>`<b onclick="openDr('${p}')">${esc(N[p].t)}</b>`).join("")}</div>`:""}
  ${anc.length?`<h4>ここに到達するまでの学習経路（${anc.length}単元）</h4>
    <ol class="route">${anc.map(a=>`<li class="${store[a]?'ok':''}" onclick="openDr('${a}')" style="cursor:pointer">${esc(N[a].t)}</li>`).join("")}</ol>`:""}`;
 dr.classList.add("on");mask.classList.add("on");hi(k);
}
function closeDr(){dr.classList.remove("on");mask.classList.remove("on");
 Object.values(els).forEach(e=>e.classList.remove("sel"));hi(null)}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeDr()});

/* フィルタ */
const off=new Set();
document.querySelectorAll(".lg[data-f]").forEach(el=>el.addEventListener("click",()=>{
 const f=el.dataset.f;off.has(f)?off.delete(f):off.add(f);
 el.classList.toggle("off",off.has(f));applyFilter();
}));
let mlOnly=false;
function toggleML(){mlOnly=!mlOnly;
 document.getElementById("mlbtn").style.color=mlOnly?"var(--ml)":"";applyFilter()}
function applyFilter(){
 Object.entries(els).forEach(([k,e])=>{
  const n=N[k],hide=off.has(n.c)||(mlOnly&&!n.ml&&!n.core);
  e.classList.toggle("hidden",hide)});
 sv.querySelectorAll(".edge").forEach(e=>{
  const a=els[e.dataset.a],b=els[e.dataset.b];
  e.style.opacity=(a.classList.contains("hidden")||b.classList.contains("hidden"))?0:"" });
}

/* 進捗 */
const TOT=Object.keys(N).length;
function upd(){const d=Object.keys(store).length,p=Math.round(d/TOT*100);
 document.getElementById("pct").textContent=p+"%";
 document.getElementById("fill").style.width=p+"%";
 document.getElementById("cnt").textContent=`${d} / ${TOT} 単元`}
function resetAll(){store={};save();
 document.querySelectorAll(".n.done").forEach(e=>e.classList.remove("done"));upd()}
upd();

/* ズーム */
let sc=1,auto=true;
function apply(){cv.style.transform=`scale(${sc})`;cv.style.height=(1330*sc)+"px"}
function fitw(){const b=document.querySelector(".scroll").clientWidth-4;sc=Math.min(1,b/1444);apply()}
function zoom(d){if(d===0){auto=true;fitw();return}
 auto=false;sc=Math.max(.35,Math.min(1.8,sc+d*.15));apply()}
window.addEventListener("resize",()=>{if(auto)fitw()});
fitw();
</script>
